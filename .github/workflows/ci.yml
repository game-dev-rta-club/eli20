name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS (Node 24)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: Run repository tests
        run: node --test tests/verify-skills.mjs
      - name: Check generated demo summaries
        run: node examples/how-to-live-on-twenty-four-hours-a-day/build-summaries.mjs --check examples/how-to-live-on-twenty-four-hours-a-day
      - name: Ensure tests leave the checkout clean
        shell: bash
        run: test -z "$(git status --porcelain)"
